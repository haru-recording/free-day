<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6월 19일까지 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0e17; --surface: #1a1826; --surface2: #231f35; --border: #2e2a42;
  --text: #fffffe; --text-mid: #a7a3c2; --text-dim: #5c5880;
  --accent: #ff6b6b; --accent2: #ffd93d; --accent3: #6bcb77;
  --serif: 'Libre Baskerville', serif; --sans: 'Nanum Gothic', sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 2rem 1rem 4rem; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 88% 80%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 20% 85%, rgba(255,255,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 70%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 42% 38%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.3) 0%, transparent 100%);
}
.container { max-width: 540px; margin: 0 auto; position: relative; z-index: 1; }
.hero { text-align: center; padding: 2rem 0 2.5rem; animation: fadeDown 0.8s ease both; }
@keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
.hero-eyebrow { font-size: 11px; letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 1rem; }
.hero-dday {
  font-family: var(--serif); font-size: clamp(80px,25vw,130px); font-weight: 700;
  line-height: 1; letter-spacing: -0.04em;
  background: linear-gradient(135deg,#ff6b6b 0%,#ffd93d 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 0.2rem;
}
.hero-date { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--text-mid); margin-bottom: 1.5rem; }
.hero-weeks { display:inline-block; background:var(--surface2); border:1px solid var(--border); border-radius:99px; padding:0.4rem 1.2rem; font-size:13px; color:var(--text-mid); letter-spacing:0.06em; }
.hero-weeks strong { color: var(--accent2); font-weight: 800; }
.progress-wrap { margin: 0 0 2.5rem; animation: fadeDown 0.8s 0.15s ease both; }
.progress-labels { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px; }
.progress-labels span:last-child { color: var(--accent3); }
.progress-track { height:4px; background:var(--surface2); border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#6bcb77,#ffd93d); border-radius:99px; transition:width 1s ease; }
.section-title { font-size:11px; letter-spacing:0.18em; color:var(--text-dim); text-transform:uppercase; margin-bottom:1rem; animation:fadeDown 0.8s 0.25s ease both; }
.calendar { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; animation:fadeDown 0.8s 0.3s ease both; }
.day-box { aspect-ratio:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--text-dim); cursor:default; transition:transform 0.15s ease,border-color 0.15s ease; position:relative; overflow:hidden; }
.day-box.unlocked { cursor:pointer; color:var(--text); }
.day-box.unlocked:hover { transform:scale(1.06); border-color:var(--accent2); }
.day-box.opened { background:var(--surface2); border-color:var(--accent2); color:var(--accent2); }
.day-box.today { border-color:var(--accent); color:var(--accent); animation:todayPulse 2s ease-in-out infinite; }
@keyframes todayPulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,107,107,0); } 50% { box-shadow:0 0 0 4px rgba(255,107,107,0.15); } }
.lock-icon { font-size:14px; opacity:0.3; }
.modal-overlay { position:fixed; inset:0; background:rgba(10,9,20,0.85); backdrop-filter:blur(6px); z-index:100; display:flex; align-items:center; justify-content:center; padding:1.5rem; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
.modal-overlay.active { opacity:1; pointer-events:all; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2rem 1.5rem; max-width:360px; width:100%; text-align:center; transform:scale(0.92); transition:transform 0.25s ease; }
.modal-overlay.active .modal { transform:scale(1); }
.modal-day { font-size:11px; letter-spacing:0.16em; color:var(--text-dim); text-transform:uppercase; margin-bottom:0.5rem; }
.modal-emoji { font-size:40px; margin-bottom:1rem; }
.modal-quote { font-family:var(--serif); font-style:italic; font-size:17px; line-height:1.6; color:var(--text); margin-bottom:1.5rem; }
.modal-divider { height:1px; background:var(--border); margin:1.2rem 0; }
.modal-challenge-label { font-size:10px; letter-spacing:0.14em; color:var(--accent3); text-transform:uppercase; margin-bottom:0.5rem; }
.modal-challenge { font-size:14px; color:var(--text-mid); line-height:1.6; }
.modal-close { margin-top:1.5rem; background:var(--surface2); border:1px solid var(--border); border-radius:99px; padding:0.6rem 1.6rem; font-family:var(--sans); font-size:13px; color:var(--text-mid); cursor:pointer; transition:border-color 0.15s,color 0.15s; }
.modal-close:hover { border-color:var(--accent2); color:var(--accent2); }
.now-label { text-align:center; font-size:11px; color:var(--text-dim); margin-top:2rem; letter-spacing:0.08em; animation:fadeDown 0.8s 0.4s ease both; }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <div class="hero-eyebrow">Free Day Countdown ✦</div>
    <div class="hero-dday" id="dday-num">D-30</div>
    <div class="hero-date">June 19, 2025 🎉</div>
    <div class="hero-weeks"><strong id="weeks-text">—</strong></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-labels"><span>5월 21일 출발</span><span id="prog-pct">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="prog-bar" style="width:0%"></div></div>
  </div>
  <div class="section-title">매일 하나씩 열어봐 📬</div>
  <div class="calendar" id="calendar"></div>
  <div class="now-label" id="now-label">—</div>
</div>
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-day" id="modal-day"></div>
    <div class="modal-emoji" id="modal-emoji"></div>
    <div class="modal-quote" id="modal-quote"></div>
    <div class="modal-divider"></div>
    <div class="modal-challenge-label">오늘의 챌린지</div>
    <div class="modal-challenge" id="modal-challenge"></div>
    <button class="modal-close" onclick="document.getElementById('modal').classList.remove('active')">닫기</button>
  </div>
</div>
<script>
const START = new Date(2025,4,21);
const END   = new Date(2025,5,19);
const CONTENT = [
  {emoji:"🌱",quote:"시작이 반이다. 나머지 반은 그냥 버티는 거야.",challenge:"오늘 딱 한 가지, 미뤄뒀던 일 5분만 해보기"},
  {emoji:"☕",quote:"좋은 하루는 좋은 커피 한 잔으로 시작된다. 아니어도 커피는 맛있다.",challenge:"오늘 좋아하는 음료 한 잔 사면서 나한테 선물하기"},
  {emoji:"🌙",quote:"밤은 낮보다 솔직하다. 오늘 밤은 뭘 생각하고 싶어?",challenge:"잠들기 전 핸드폰 내려놓고 5분 멍 때리기"},
  {emoji:"✨",quote:"빛나는 사람은 따로 있는 게 아니라, 그냥 계속 켜져 있는 사람이야.",challenge:"오늘 누군가한테 진심 어린 칭찬 한 마디 하기"},
  {emoji:"🎈",quote:"기다림은 설렘의 다른 이름이다.",challenge:"6월 19일에 하고 싶은 일 딱 하나 정해보기"},
  {emoji:"🌊",quote:"파도를 멈출 순 없지만, 서핑은 배울 수 있다. — 존 카밧진",challenge:"오늘 잠깐이라도 밖에 나가 바람 맞기"},
  {emoji:"😂",quote:"인생은 너무 짧아서 지루한 양말을 신을 시간이 없다.",challenge:"오늘 별거 아닌 것에 크게 웃어보기"},
  {emoji:"🌸",quote:"벚꽃이 짧게 피어서 더 아름다운 것처럼, 기다리는 시간도 나중엔 예뻐 보일 거야.",challenge:"요즘 예쁜 것 하나 찾아서 사진 찍기"},
  {emoji:"📖",quote:"읽지 않은 책은 열리지 않은 선물이다.",challenge:"오늘 딱 10페이지만 읽기 (유튜브 말고)"},
  {emoji:"🎵",quote:"음악은 언어가 끝나는 곳에서 시작된다. — 하인리히 하이네",challenge:"오늘 기분에 딱 맞는 플레이리스트 만들기"},
  {emoji:"🍳",quote:"요리는 사랑의 언어다. 배달 앱도 그 언어의 번역이고.",challenge:"오늘 직접 뭔가 만들어 먹기 (라면도 OK)"},
  {emoji:"💌",quote:"보내지 않은 편지가 가장 솔직한 편지다.",challenge:"좋아하는 사람한테 연락 한 번 하기"},
  {emoji:"🧩",quote:"퍼즐 한 조각이 없으면 완성이 안 되듯, 너도 꼭 필요한 사람이야.",challenge:"오늘 스스로 잘한 일 하나 찾아서 적어두기"},
  {emoji:"🌈",quote:"비 온 뒤에 무지개가 오는 건 아니지만, 비는 어쨌든 그쳐.",challenge:"요즘 힘든 일 하나, 그냥 내려놓아 보기"},
  {emoji:"🏃",quote:"반환점을 돌았다! 이제부터는 내리막.",challenge:"오늘 몸을 조금 움직이기 — 산책 10분도 충분해"},
  {emoji:"🌟",quote:"중간 지점이라는 건 없다. 지금 이 순간이 바로 그 지점이야.",challenge:"오늘 하루 뭐가 좋았는지 딱 한 줄 기록하기"},
  {emoji:"🦋",quote:"번데기 시절이 없으면 나비도 없다.",challenge:"요즘 내가 변하고 있는 부분 하나 찾아보기"},
  {emoji:"🎨",quote:"창의성은 지우개를 아끼지 않는 데서 온다.",challenge:"낙서든 메모든 뭔가 손으로 직접 써보기"},
  {emoji:"🌻",quote:"해바라기는 구름 낀 날에도 해를 기억하며 자란다.",challenge:"오늘 감사한 것 세 가지 떠올려보기"},
  {emoji:"🍀",quote:"네 잎 클로버를 찾는 사람은 세 잎 클로버를 밟고 있다. 지금 발밑도 봐.",challenge:"오늘 주변에서 작은 행운 하나 발견하기"},
  {emoji:"🎭",quote:"인생은 연극이다. 그리고 넌 주연이야 — 조연 아님.",challenge:"오늘 평소와 다른 행동 딱 하나 해보기"},
  {emoji:"🚀",quote:"완벽한 타이밍을 기다리지 마. 지금이 항상 최선이야.",challenge:"오래 미뤄온 것 하나, 오늘 그냥 시작해버리기"},
  {emoji:"🕯️",quote:"촛불은 어둠을 탓하지 않는다. 그냥 켜진다.",challenge:"오늘 좋아하는 향 맡기 — 커피, 책, 비 냄새 뭐든"},
  {emoji:"🌊",quote:"D-6! 파도가 밀려오고 있어. 곧이야.",challenge:"6월 19일 뭐 입을지 미리 생각해두기 ㅋㅋ"},
  {emoji:"🎁",quote:"D-5! 선물 포장지를 뜯기 직전의 그 설렘, 바로 지금이야.",challenge:"오늘 자신에게 작은 선물 하기 (뭐든)"},
  {emoji:"⏰",quote:"D-4! 기다림이 거의 다 끝나간다.",challenge:"6/19 같이 보낼 사람한테 미리 연락해두기"},
  {emoji:"🌙",quote:"D-3! 이제 손에 잡힐 듯 가까워졌어.",challenge:"오늘 일찍 자기. 6/19를 최상의 컨디션으로!"},
  {emoji:"🎊",quote:"D-2! 내일이면 내일이야!",challenge:"내일 뭐 먹을지 미리 정해두기 🍽️"},
  {emoji:"🌅",quote:"D-1! 내일이 바로 그날이야. 잘 자고 내일 봐!",challenge:"일찍 자기. 진짜로."},
  {emoji:"🎉",quote:"오늘이야!!! 드디어 Free Day! 오늘 하루 전부 누려.",challenge:"오늘만큼은 아무 챌린지 없음. 그냥 즐겨! 🥳"},
];

function getLocalDateStamp(date) {
  // YYYYMMDD 숫자로 변환 — 시간대 무관하게 날짜만 비교
  return date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
}

function buildCalendar() {
  const cal = document.getElementById('calendar');
  const openedKey = 'advent_opened_619';
  let opened = [];
  try { opened = JSON.parse(localStorage.getItem(openedKey) || '[]'); } catch(e) {}
  cal.innerHTML = '';

  const now = new Date();
  const todayStamp = getLocalDateStamp(now);

  for (let i = 0; i < 30; i++) {
    const box = document.createElement('div');
    box.className = 'day-box';
    const boxDate = new Date(START.getFullYear(), START.getMonth(), START.getDate() + i);
    const boxStamp = getLocalDateStamp(boxDate);
    const dateLabel = `<span style="font-size:10px;opacity:0.6;display:block;line-height:1.2">${boxDate.getMonth()+1}월</span><span style="font-size:15px;line-height:1.2">${boxDate.getDate()}</span>`;

    if (boxStamp === todayStamp) {
      box.classList.add('unlocked', 'today');
      if (opened.includes(i)) box.classList.add('opened');
      box.innerHTML = dateLabel;
      box.onclick = () => openBox(i, opened, openedKey);
    } else if (boxStamp < todayStamp) {
      box.classList.add('unlocked');
      if (opened.includes(i)) box.classList.add('opened');
      box.innerHTML = dateLabel;
      box.onclick = () => openBox(i, opened, openedKey);
    } else {
      box.innerHTML = '<span class="lock-icon">🔒</span>';
      box.onclick = null;
    }
    cal.appendChild(box);
  }
}

function openBox(idx, opened, openedKey) {
  const c = CONTENT[idx];
  const date = new Date(START); date.setDate(date.getDate() + idx);
  document.getElementById('modal-day').textContent = `Day ${idx+1} · ${date.getMonth()+1}월 ${date.getDate()}일`;
  document.getElementById('modal-emoji').textContent = c.emoji;
  document.getElementById('modal-quote').textContent = c.quote;
  document.getElementById('modal-challenge').textContent = c.challenge;
  document.getElementById('modal').classList.add('active');
  if (!opened.includes(idx)) {
    opened.push(idx);
    try { localStorage.setItem(openedKey, JSON.stringify(opened)); } catch(e) {}
    buildCalendar();
  }
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('active');
}

function updateHero() {
  const now = new Date();
  const diff = END - now;
  const d = Math.max(0, Math.ceil(diff / 86400000));
  document.getElementById('dday-num').textContent = d === 0 ? '🎉' : `D-${d}`;
  const weeks = Math.floor(d / 7), days = d % 7;
  let wt = d === 0 ? '오늘이 바로 그날! 🎊' : weeks > 0 && days > 0 ? `${weeks}주 ${days}일 남음` : weeks > 0 ? `딱 ${weeks}주 남음` : `${days}일 남음`;
  document.getElementById('weeks-text').textContent = wt;
  const total = END - START, elapsed = now - START;
  const pct = Math.min(100, Math.max(0, elapsed / total * 100));
  document.getElementById('prog-pct').textContent = pct.toFixed(1) + '%';
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('now-label').textContent = new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',weekday:'short'}).format(now);
}

buildCalendar();
updateHero();
setInterval(updateHero, 60000);
</script>
</body>
</html>
